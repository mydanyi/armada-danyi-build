f /etc/.updated 0644 root root -
f /var/.updated 0644 root root -
# Session-user-owned so steamos-select-branch records the channel unprivileged.
f /var/lib/armada/update-channel 0644 armada armada -
# Personal (单翼版) channel state, kept separate from the official file so a
# personal image never treats the legacy official state as a fresh choice.
f /var/lib/armada/personal-update-channel 0644 armada armada -
