name: Armada Danyi image and upgrade

# Personal, publicly published build of the personalized Armada image.
#
# Everything runs on this self-hosted Docker runner only: nothing is pushed to
# a container registry (no GHCR). The heavy build CPU lives solely on the build
# server's Docker daemon (its socket is bind-mounted into the runner); the NAS
# is used as an authoritative store for the source, logs, metadata and the
# finished image. The packaged install and upgrade artifacts are additionally
# published to a GitHub Release, but only when the manual run asks for it.
#
# The official workflows were moved to .github/upstream-workflows and no longer
# run automatically; this file does not touch them.
#
# All ARMADA_* values (execution base and NAS endpoint/key/known-hosts) are
# already present in the runner environment; no GitHub secret is added. The
# Release steps reuse only the automatic GITHUB_TOKEN.

# This workflow is manual-only: it never triggers on push, tag, schedule or any
# upstream code sync. It is started explicitly via "Run workflow", and it only
# publishes a Release when the publish_release input is set to true.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the completed GitHub Release from the packaged artifacts
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Exactly one full personal build at a time: a newly queued run waits for the
# in-flight build to finish instead of cancelling it, so a complete image is
# never aborted half-way.
concurrency:
  group: armada-personal-build
  cancel-in-progress: false

jobs:
  build:
    name: Build personal Armada image
    runs-on: [self-hosted, Linux, X64, armada-personal, docker]
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credentials are left in the checkout, so the source archive on
          # the NAS never carries a token or user config.
          persist-credentials: false

      - name: Prepare task space
        shell: bash
        run: |
          set -euo pipefail

          # The Docker daemon of the build server must be reachable from this
          # runner before any heavy work starts.
          docker info >/dev/null

          : "${GITHUB_RUN_ID:?}" "${GITHUB_RUN_ATTEMPT:?}" "${GITHUB_RUN_NUMBER:?}" "${GITHUB_SHA:?}" "${GITHUB_WORKSPACE:?}"
          : "${ARMADA_EXECUTION_BASE:?ARMADA_EXECUTION_BASE must be set by the runner}"

          [[ "${ARMADA_EXECUTION_BASE}" == /* ]] \
            || { echo "ERROR: ARMADA_EXECUTION_BASE must be absolute: ${ARMADA_EXECUTION_BASE}" >&2; exit 2; }

          BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          shortsha="${GITHUB_SHA:0:8}"
          # Unique on every run: the Hong Kong calendar date, the monotonic run
          # number and the short commit are all part of the version string.
          ARMADA_VERSION="$(TZ=Asia/Hong_Kong date +%Y%m%d).danyi.${GITHUB_RUN_NUMBER}.${shortsha}"
          TASK_ROOT="${ARMADA_EXECUTION_BASE}/runs/${BUILD_ID}"
          SRC_ROOT="${GITHUB_WORKSPACE}"

          # This run only ever touches its own task directory, and the runner
          # bind-mounts these very same absolute paths, so the build server's
          # Docker daemon can mount them unchanged.
          case "${TASK_ROOT}/" in
            "${ARMADA_EXECUTION_BASE}/runs/"*) ;;
            *) echo "ERROR: TASK_ROOT escapes ARMADA_EXECUTION_BASE: ${TASK_ROOT}" >&2; exit 2 ;;
          esac
          [[ "${SRC_ROOT}" == /* ]] || { echo "ERROR: SRC_ROOT must be absolute: ${SRC_ROOT}" >&2; exit 2; }

          mkdir -p "${TASK_ROOT}/work" "${TASK_ROOT}/logs" "${TASK_ROOT}/output"

          # Cache is shared across runs and lives only under
          # ARMADA_EXECUTION_BASE; the task reaches it through a symlink so no
          # build output ever lands outside this task's own space.
          CACHE_TARGET="${ARMADA_EXECUTION_BASE}/cache"
          mkdir -p "${CACHE_TARGET}"

          # Never delete pre-existing data: if a real directory (not a symlink)
          # already sits at ${TASK_ROOT}/cache, stop instead of rm -rf'ing it.
          if [[ -e "${TASK_ROOT}/cache" && ! -L "${TASK_ROOT}/cache" ]]; then
            echo "ERROR: ${TASK_ROOT}/cache exists and is not a symlink; refusing to replace data" >&2
            exit 2
          fi

          # Keep a symlink that already points at the shared cache; otherwise
          # (re)create it.
          if [[ -L "${TASK_ROOT}/cache" && "$(readlink "${TASK_ROOT}/cache")" == "${CACHE_TARGET}" ]]; then
            echo "==> Reusing existing cache symlink -> ${CACHE_TARGET}"
          else
            ln -sfn "${CACHE_TARGET}" "${TASK_ROOT}/cache"
          fi

          {
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "ARMADA_VERSION=${ARMADA_VERSION}"
            echo "BUILD_ID=${BUILD_ID}"
          } > "${TASK_ROOT}/work/build-source.txt"

          {
            echo "BUILD_ID=${BUILD_ID}"
            echo "ARMADA_VERSION=${ARMADA_VERSION}"
            echo "TASK_ROOT=${TASK_ROOT}"
            echo "SRC_ROOT=${SRC_ROOT}"
          } >> "${GITHUB_ENV}"

          echo "BUILD_ID=${BUILD_ID}"
          echo "ARMADA_VERSION=${ARMADA_VERSION}"
          echo "TASK_ROOT=${TASK_ROOT}"

      - name: Back up source to NAS
        shell: bash
        # Probes the NAS run directory for writability and archives the exact
        # inputs. A failure here stops the workflow before the build starts.
        run: bash personal-build/sync-nas.sh source

      - name: Build rootfs image
        shell: bash
        env:
          # Handed to the rootfs build as a Docker secret; never printed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash personal-build/build-rootfs.sh "${TASK_ROOT}" "${SRC_ROOT}"

      - name: Build disk image
        shell: bash
        run: bash personal-build/build-disk.sh "${TASK_ROOT}" "${SRC_ROOT}"

      - name: Build OCI upgrade archive
        shell: bash
        # Packages TASK_ROOT/work/rootfs.tar into the OCI archive that the
        # installed-device upgrade path consumes.
        run: bash personal-build/build-oci.sh "${TASK_ROOT}" "${SRC_ROOT}"

      - name: Prepare release-tools image
        shell: bash
        # Builds the local release/test tool image (7-Zip 26.04 + gzip) that the
        # release tests and the packaging step both run inside. Nothing is pushed
        # to a registry: the tag only ever lives on this runner's Docker daemon.
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            -t local/armada-personal-release-tools:7zip26.04 \
            -f "${SRC_ROOT}/personal-build/release-tools.Dockerfile" \
            "${SRC_ROOT}"

      - name: Run release tests
        shell: bash
        # The offline release tests run in the local release-tools image (the
        # same image the packaging step uses), with no network: the source is
        # mounted read-only at /src, the tests' scratch space is this task's
        # work/tests mounted at /test-work, and TMPDIR points there so no fixture
        # lands outside the task.
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/work/tests"
          docker run --rm --init --network none \
            --platform linux/amd64 \
            -e TMPDIR=/test-work \
            -v "${SRC_ROOT}:/src:ro" \
            -v "${TASK_ROOT}/work/tests:/test-work" \
            --entrypoint /bin/bash \
            local/armada-personal-release-tools:7zip26.04 \
            -c '
              set -euo pipefail
              bash /src/personal-build/tests/upgrade-release-test.sh
              bash /src/personal-build/tests/update-inhibit-test.sh
              bash /src/personal-build/tests/personal-update-target-test.sh
              bash /src/personal-build/tests/package-hash-failure-test.sh
              bash /src/personal-build/tests/install-7z-test.sh
            '

      - name: Package release artifacts
        shell: bash
        # Runs inside the release-tools image with no network: it drives
        # package-install.sh to build the 7z install volumes, splits the OCI
        # archive, writes SHA256SUMS and stages everything under
        # TASK_ROOT/output/release/ for upload. TASK_ROOT is bind-mounted
        # read-write (staging/output) and SRC_ROOT read-only (update.sh and the
        # package scripts) at the very same absolute paths the runner uses, so
        # the build server's daemon mounts them unchanged. The release-tools
        # image has no git, so the source archive is created here on the runner
        # (which has git) as TASK_ROOT/work/release-source.tar.gz and handed to
        # the container as a fixture via ARMADA_SOURCE_ARCHIVE. ARMADA_VERSION is
        # handed through to the script.
        run: |
          set -euo pipefail
          git -C "${SRC_ROOT}" archive HEAD | gzip -1 > "${TASK_ROOT}/work/release-source.tar.gz"
          docker run --rm --network none \
            --platform linux/amd64 \
            --cpus 8 --memory 8g \
            -e ARMADA_VERSION \
            -e ARMADA_SOURCE_ARCHIVE="${TASK_ROOT}/work/release-source.tar.gz" \
            -v "${TASK_ROOT}:${TASK_ROOT}:rw" \
            -v "${SRC_ROOT}:${SRC_ROOT}:ro" \
            --entrypoint bash \
            local/armada-personal-release-tools:7zip26.04 \
            "${SRC_ROOT}/personal-build/package-release.sh" "${TASK_ROOT}" "${SRC_ROOT}"

      - name: Publish results to NAS
        if: always()
        shell: bash
        run: |
          set +e
          bash personal-build/sync-nas.sh results
          sync_rc=$?
          set -e

          task_root="${TASK_ROOT:-}"

          install_present="no"
          install_names=""
          oci_present="no"
          oci_names=""
          if [[ -n "${task_root}" && -d "${task_root}/output" ]]; then
            shopt -s nullglob
            imgs=( "${task_root}/output"/armada-*.img.gz )
            ocis=( "${task_root}/output"/armada-*.oci.tar )
            shopt -u nullglob
            if (( ${#imgs[@]} > 0 )); then
              install_present="yes"
              install_names="$(printf '%s ' "${imgs[@]##*/}")"
            fi
            if (( ${#ocis[@]} > 0 )); then
              oci_present="yes"
              oci_names="$(printf '%s ' "${ocis[@]##*/}")"
            fi
          fi

          {
            echo "## Armada Danyi image and upgrade"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | \`${ARMADA_VERSION:-unknown}\` |"
            echo "| build id | \`${BUILD_ID:-unknown}\` |"
            echo "| install image | ${install_present}${install_names:+ (${install_names})} |"
            echo "| upgrade OCI | ${oci_present}${oci_names:+ (${oci_names})} |"
            echo "| NAS upload exit | ${sync_rc} |"
            echo
            echo "> Not yet validated on real hardware."
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${sync_rc}"

      - name: Create draft release
        id: release
        # Only a fully successful build that was explicitly asked to publish a
        # Release reaches this step. It creates the draft metadata only; the
        # assets are uploaded sequentially by the next step. The Release stays a
        # draft until the PATCH below, so an incomplete attachment is never
        # exposed publicly.
        if: ${{ success() && github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.ARMADA_VERSION }}
          name: Armada Danyi ${{ env.ARMADA_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: personal-build/RELEASE-NOTES.md

      - name: Upload release assets
        # Streams the assets one at a time; concurrency is what exhausted runner
        # memory and made the API close the connection mid-upload.
        if: ${{ success() && github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: bash personal-build/upload-release.sh "${TASK_ROOT}" "${RELEASE_ID}"

      - name: Publish the release
        # Flip the freshly created draft to a public, latest release only after
        # every asset uploaded successfully. The token comes solely from the
        # environment and is never printed (`set -x` is deliberately not used).
        if: ${{ success() && github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?GITHUB_TOKEN missing}"
          : "${RELEASE_ID:?release id missing}"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -d "{\"tag_name\":\"v${ARMADA_VERSION}\",\"draft\":false,\"make_latest\":\"true\"}"
