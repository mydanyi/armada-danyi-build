name: Sync Armada upstream and bundled plugins

# Merge armada-os/armada main into this personal build repo and, when the repo
# carries personal-build/plugins.lock.json, refresh the three standalone Decky
# plugin releases it pins (armada-installer, LSFG-VK ARM64, DeckyClash).
#
# Manual-only. The daily merge is run by the server-side systemd timer
# armada-personal-upstream-sync.timer on the 192.168.88.9 host, which starts the
# sync script inside the existing Docker runner. This GitHub workflow's schedule
# produced no runs during verification, so it is kept for manual sync only;
# start it via "Run workflow" for an on-demand sync.
#
# Never runs on push, so the merge it makes cannot re-trigger itself. The
# personal layer (custom workflows, Chinese/plugin/unmerged patches, build
# config) is kept as is. It never builds an image, opens a PR or dispatches a
# workflow: the personal image is still built manually and separately. The push
# uses a dedicated, repo-scoped write deploy key already provisioned on the
# runner; this workflow never prints deploy-key contents.
on:
  # Manual-only: the daily 04:17 Asia/Hong_Kong sync is performed by the server
  # timer (armada-personal-upstream-sync.timer). Trigger this by hand for an
  # ad-hoc sync.
  workflow_dispatch:

permissions:
  contents: read

# Share the single personal-build lock: an in-flight manual build keeps running
# and this sync waits instead of cancelling it (and vice versa).
concurrency:
  group: armada-personal-build
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream main
    runs-on: [self-hosted, Linux, X64, armada-personal, docker]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream into main
        id: sync
        shell: bash
        env:
          # Optional read-only token for the private LSFG-VK release repo. When
          # the secret is absent it is passed as an empty value, the private
          # plugin is reported as skipped and the public plugins still sync.
          # GITHUB_TOKEN is deliberately not offered: it must not reach the
          # private repository.
          GH_TOKEN: ${{ secrets.PLUGIN_RELEASE_READ_TOKEN }}
        run: bash personal-build/sync-upstream.sh "${GITHUB_WORKSPACE}"

      - name: Push synced main
        id: push
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_REPOSITORY:?}"
          : "${ARMADA_EXECUTION_BASE:?ARMADA_EXECUTION_BASE must be set by the runner}"
          [[ "${ARMADA_EXECUTION_BASE}" == /* ]] \
            || { echo "ERROR: ARMADA_EXECUTION_BASE must be absolute" >&2; exit 2; }

          key="${ARMADA_EXECUTION_BASE}/credentials/upstream-sync-ed25519"
          known="${ARMADA_EXECUTION_BASE}/credentials/github-sync-known-hosts"
          [[ -f "${key}" ]] || { echo "ERROR: deploy key not found: ${key}" >&2; exit 1; }
          [[ -f "${known}" ]] || { echo "ERROR: known_hosts not found: ${known}" >&2; exit 1; }

          # Dedicated write deploy key over SSH on port 443 (github.com host-key
          # alias). Never GITHUB_TOKEN, never --force, key never printed.
          export GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known} -o HostKeyAlias=github.com -p 443"
          git push "git@ssh.github.com:${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          changed='${{ steps.sync.outputs.changed }}'
          sha='${{ steps.sync.outputs.new_sha }}'
          plugins_updated='${{ steps.sync.outputs.plugins_updated }}'
          plugins_skipped='${{ steps.sync.outputs.plugins_skipped }}'
          {
            echo "## Sync Armada upstream and bundled plugins"
            echo
            if [[ "${changed}" == 'true' ]]; then
              if [[ '${{ steps.push.outcome }}' == 'success' ]]; then
                echo "Synced main to \`${sha}\`: upstream merge and/or bundled plugin release update (pushed to main)."
              else
                echo "Prepared \`${sha}\` locally (upstream merge and/or bundled plugin release update); push failed — main was not updated."
              fi
            elif [[ "${changed}" == 'false' ]]; then
              echo "No new upstream commits and no bundled plugin release changes; nothing to push."
            else
              echo "Sync did not complete (outcome: ${{ steps.sync.outcome }})."
            fi
            echo
            echo "Bundled plugin releases: ${plugins_updated:-0} updated, ${plugins_skipped:-0} skipped."
            echo "A skipped private plugin (missing read credential) keeps its locked version."
            echo
            echo "No build was triggered: the personal image is built manually only."
          } >> "${GITHUB_STEP_SUMMARY}"
